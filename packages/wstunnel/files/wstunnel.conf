# =====================================================================
# SERVER INSTANCE 1: RESTRICTED/FORWARD ROUTER
# Forces all incoming client connections straight to WireGuard.
# =====================================================================
config server 'wireguard_server'
	option enabled '0'
	option listen 'wss://0.0.0.0:443'
	option redirect 'localhost:51820'

config client 'wireguard_client'
	option enabled '0'
	option server 'wss://example-remote-server.com:443'
	option redirect 'udp://127.0.0.1:51820:localhost:51820'

# =====================================================================
# SERVER INSTANCE 2: DYNAMIC FORWARD PROXY
# Acts as an open/forward tunnel. The client determines the target.
# =====================================================================
config server 'open_proxy_server'
	option enabled '0'
	option listen 'wss://0.0.0.0:8443'

config client 'open_proxy_client'
	option enabled '0'
	option server 'wss://example-remote-server.com:8443'
	option redirect 'socks5://0.0.0.0:1080'
